<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input Resep — Notifikasi Pasien CAPD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <div id="nav"></div>

  <main class="max-w-3xl mx-auto px-4 py-6">

    <div class="mb-6">
      <a href="dashboard.html" class="text-sm text-blue-600 hover:underline">← Kembali ke Dashboard</a>
      <h1 class="text-2xl font-bold text-slate-800 mt-2">Input Resep Pasien CAPD</h1>
      <p class="text-sm text-slate-500">Isi data resep & tanggal kontrol berikutnya</p>
    </div>

    <form id="resepForm" class="bg-white rounded-xl shadow-sm p-6 space-y-5">

      <!-- Pasien -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Pasien <span class="text-red-500">*</span></label>
        <select id="patient_id" required
                class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="">-- Pilih Pasien --</option>
        </select>
      </div>

      <!-- Tgl kontrol hari ini -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tgl Kontrol Hari Ini <span class="text-red-500">*</span></label>
          <input type="date" id="tgl_kontrol" required
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Tgl Kontrol Berikutnya <span class="text-red-500">*</span></label>
          <input type="date" id="tgl_kontrol_berikutnya" required
                 class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
        </div>
      </div>

      <!-- Detail resep -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Detail Resep <span class="text-red-500">*</span></label>
        <textarea id="detail_resep" required rows="5"
                  placeholder="Contoh:
- Dianeal 2.5% x 30 bag
- Dianeal 1.5% x 30 bag
- Cefazolin 500 mg"
                  class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm"></textarea>
        <p class="text-xs text-slate-500 mt-1">Tulis satu obat per baris (boleh pakai tanda "-" atau tanpa)</p>
      </div>

      <!-- Distributor -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Distributor <span class="text-red-500">*</span></label>
        <input type="text" id="distributor" required
               placeholder="Contoh: Kimia Farma / Anugrah Pharm"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>

      <!-- Catatan -->
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Catatan (opsional)</label>
        <input type="text" id="catatan"
               placeholder="Misal: pasien minta antar siang"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" />
      </div>

      <!-- Preview WA -->
      <div id="waPreview" class="hidden bg-green-50 border border-green-200 rounded-lg p-4">
        <div class="text-xs font-semibold text-green-800 mb-2">📱 Preview WA ke Logistik:</div>
        <div id="waPreviewText" class="text-sm text-green-900 whitespace-pre-wrap font-mono"></div>
      </div>

      <div id="msg" class="hidden text-sm rounded-lg p-3"></div>

      <!-- Buttons -->
      <div class="flex gap-3 pt-2">
        <button type="button" id="btnSaveOnly"
                class="flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 rounded-lg transition">
          Simpan Saja
        </button>
        <button type="submit" id="btnSaveWA"
                class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
          💾 Simpan & Kirim WA Logistik
        </button>
      </div>
    </form>

  </main>

  <script src="config.js"></script>
  <script>
    let SETTINGS = {};
    let PATIENTS = {};

    function showMsg(text, type = 'info') {
      const el = document.getElementById('msg');
      el.className = 'text-sm rounded-lg p-3 ' +
        (type === 'error' ? 'bg-red-50 text-red-700' :
         type === 'success' ? 'bg-green-50 text-green-700' :
                             'bg-blue-50 text-blue-700');
      el.textContent = text;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    }

    // ---------------------------------------------------------
    // Load settings & pasien
    // ---------------------------------------------------------
    async function loadData() {
      const [setRes, patRes] = await Promise.all([
        sb.from('settings').select('key, value'),
        sb.from('patients').select('id, nama, no_rm, no_wa, distributor_default').eq('aktif', true).order('nama')
      ]);

      SETTINGS = Object.fromEntries((setRes.data || []).map(r => [r.key, r.value]));

      PATIENTS = {};
      const sel = document.getElementById('patient_id');
      (patRes.data || []).forEach(p => {
        PATIENTS[p.id] = p;
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.nama} (${p.no_rm})`;
        sel.appendChild(opt);
      });

      // Preselect dari query string ?patient_id=...
      const urlParams = new URLSearchParams(window.location.search);
      const preId = urlParams.get('patient_id');
      if (preId && PATIENTS[preId]) {
        sel.value = preId;
        onPatientChange();
      }
    }

    // ---------------------------------------------------------
    // Auto-isi distributor + preview WA
    // ---------------------------------------------------------
    function onPatientChange() {
      const id = document.getElementById('patient_id').value;
      if (!id) return;
      const p = PATIENTS[id];
      if (p?.distributor_default && !document.getElementById('distributor').value) {
        document.getElementById('distributor').value = p.distributor_default;
      }
      updatePreview();
    }

    function updatePreview() {
      const id = document.getElementById('patient_id').value;
      if (!id) { document.getElementById('waPreview').classList.add('hidden'); return; }
      const p = PATIENTS[id];
      const tpl = SETTINGS.template_resep_baru || '';
      const data = {
        nama: p.nama,
        no_rm: p.no_rm,
        tgl_kontrol: fmtDate(document.getElementById('tgl_kontrol').value),
        detail_resep: document.getElementById('detail_resep').value || '-',
        distributor: document.getElementById('distributor').value || '-',
      };
      document.getElementById('waPreviewText').textContent = renderTemplate(tpl, data);
      document.getElementById('waPreview').classList.remove('hidden');
    }

    // ---------------------------------------------------------
    // Submit
    // ---------------------------------------------------------
    async function doSave(kirimWA) {
      const patient_id = document.getElementById('patient_id').value;
      const tgl_kontrol = document.getElementById('tgl_kontrol').value;
      const tgl_kontrol_berikutnya = document.getElementById('tgl_kontrol_berikutnya').value;
      const detail_resep = document.getElementById('detail_resep').value.trim();
      const distributor = document.getElementById('distributor').value.trim();
      const catatan = document.getElementById('catatan').value.trim();

      if (!patient_id || !tgl_kontrol || !tgl_kontrol_berikutnya || !detail_resep || !distributor) {
        showMsg('Mohon lengkapi field bertanda *', 'error');
        return;
      }

      // 1. Insert ke prescriptions
      const { data: inserted, error } = await sb.from('prescriptions').insert({
        patient_id, tgl_kontrol, tgl_kontrol_berikutnya,
        detail_resep, distributor, catatan: catatan || null,
        status_sp: 'belum_sp',
        notif_terkirim: false
      }).select().single();

      if (error) {
        showMsg('Gagal menyimpan: ' + error.message, 'error');
        return;
      }

      showMsg('Resep berhasil disimpan ✓', 'success');

      // 2. Kirim WA (opsional)
      if (kirimWA) {
        const p = PATIENTS[patient_id];
        const tpl = SETTINGS.template_resep_baru || '';
        const pesan = renderTemplate(tpl, {
          nama: p.nama,
          no_rm: p.no_rm,
          tgl_kontrol: fmtDate(tgl_kontrol),
          detail_resep,
          distributor,
        });

        const target = SETTINGS.wa_logistik;
        if (!target) {
          showMsg('Resep tersimpan, tapi nomor WA logistik belum di-set di Pengaturan', 'error');
          return;
        }

        const res = await sendWA({
          prescription_id: inserted.id,
          tipe: 'resep_baru',
          target_wa: target,
          pesan
        });

        if (res.ok) {
          await sb.from('prescriptions').update({
            notif_terkirim: true,
            notif_sent_at: new Date().toISOString()
          }).eq('id', inserted.id);
          showMsg('Resep tersimpan & WA terkirim ke logistik ✓', 'success');
        } else {
          showMsg('Resep tersimpan, tapi WA gagal: ' + JSON.stringify(res.fonnte || res.error), 'error');
        }
      }

      setTimeout(() => window.location.href = 'dashboard.html', 1200);
    }

    document.getElementById('resepForm').addEventListener('submit', (e) => {
      e.preventDefault();
      doSave(true);
    });

    document.getElementById('btnSaveOnly').addEventListener('click', () => doSave(false));

    // ---------------------------------------------------------
    // Bind events
    // ---------------------------------------------------------
    document.getElementById('patient_id').addEventListener('change', onPatientChange);
    ['tgl_kontrol','tgl_kontrol_berikutnya','detail_resep','distributor'].forEach(id => {
      document.getElementById(id).addEventListener('input', updatePreview);
    });

    // ---------------------------------------------------------
    // Init
    // ---------------------------------------------------------
    (async () => {
      const session = await requireAuth();
      if (!session) return;
      document.getElementById('nav').innerHTML = renderNav('input-resep.html');
      await loadData();

      // Default tanggal: hari ini untuk kontrol, +30 hari untuk berikutnya
      const today = new Date().toISOString().slice(0,10);
      document.getElementById('tgl_kontrol').value = today;
      const next = new Date(Date.now() + 30*24*60*60*1000).toISOString().slice(0,10);
      document.getElementById('tgl_kontrol_berikutnya').value = next;
    })();
  </script>
</body>
</html>
