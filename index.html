<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Notifikasi Pasien CAPD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-xl shadow-lg w-full max-w-sm p-6">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">💊</div>
      <h1 class="text-xl font-bold text-slate-800">Notifikasi Pasien CAPD</h1>
      <p class="text-sm text-slate-500 mt-1">Farmasi Rawat Jalan & Logistik</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input type="email" id="email" required
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
               placeholder="farmasi@rsanda.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none"
               placeholder="••••••••" />
      </div>

      <div id="msg" class="hidden text-sm rounded-lg p-3"></div>

      <button type="submit" id="btnLogin"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg transition">
        Masuk
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // NOTE: untuk halaman login, kita panggil config secara manual
    // (karena belum login). Ganti URL & KEY di bawah.
    const SUPABASE_URL      = 'https://jopljietaofydczmchzm.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvcGxqaWV0YW9meWRjem1jaHptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0ODE5MDksImV4cCI6MjEwNzA1NzkwOX0.VCpL5ACchcRaHYogEAE44My2XWToL4NQAe3gB4E9lWs';
    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Kalau sudah login, langsung ke dashboard
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    function showMsg(text, type = 'error') {
      const el = document.getElementById('msg');
      el.className = 'text-sm rounded-lg p-3 ' +
        (type === 'error' ? 'bg-red-50 text-red-700' : 'bg-green-50 text-green-700');
      el.textContent = text;
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await sb.auth.signInWithPassword({ email, password });

      if (error) {
        showMsg('Login gagal: ' + error.message);
        btn.disabled = false;
        btn.textContent = 'Masuk';
        return;
      }

      showMsg('Berhasil, mengalihkan...', 'success');
      setTimeout(() => window.location.href = 'dashboard.html', 400);
    });
  </script>
</body>
</html>
